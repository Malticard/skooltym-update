name: Skooltym Admin Deployment
on:
  push:
    branches: [ "update" ]
  # workflow_dispatch: # Allow manual triggering

env:
  NODE_VERSION: '22'
  APP_NAME: 'Skooltym admin' # Change this to your app name

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Setup SSH Connection
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

    - name: Create Deployment Package
      run: |
        # Create exclude file for rsync
        cat > .rsync-exclude << 'EOF'
        .nyc_output/
        __tests__/
        node_modules/
        .rsync-exclude
        uploads/
        EOF
    - name: Deploy Application Files
      run: |
        rsync -avz --delete \
          --exclude-from=.rsync-exclude \
          --chmod=D755,F644 \
          --progress \
          ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.SERVER_DESTINATION }}/

    - name: Setup Node.js on Server & Install Dependencies
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
          cd ${{ secrets.SERVER_DESTINATION }}
          
          # Install ALL dependencies (including devDependencies for NestJS CLI)
          npm ci && npm run build

          # Set proper permissions
          find . -type f -name "*.js" -exec chmod 644 {} \;
          find . -type d -exec chmod 755 {} \;
          
          echo "Dependencies installed and permissions set"

          # Stop existing PM2 process (if running)
          # pm2 stop skooltym_admin 2>/dev/null || echo "No existing process to stop"
          
          # Save PM2 configuration
          pm2 restart skooltym_admin
          pm2 save
        ENDSSH

  
  notification:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Notify Deployment Status
      run: |
        if [ "${{ needs.deploy.result }}" == "success" ]; then
          echo "✅ Deployment completed successfully!"
          # Add notification logic here (Slack, Discord, email, etc.)
          
        else
          echo "❌ Deployment failed!"
          # Add failure notification logic here
        fi